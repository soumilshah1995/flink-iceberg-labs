services:
  # ==============================================================================
  # MinIO - S3-compatible object storage
  # ==============================================================================
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: lab3-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web UI
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      flink-network:
        aliases:
          - warehouse.minio

  # Create S3 buckets on startup
  create-buckets:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: lab3-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 admin password;
      mc mb minio/raw-input --ignore-existing;
      mc mb minio/warehouse --ignore-existing;
      echo 'Buckets created: raw-input, warehouse';
      "
    networks:
      - flink-network

  # ==============================================================================
  # Iceberg REST Catalog
  # ==============================================================================
  iceberg-rest:
    image: apache/iceberg-rest-fixture
    hostname: iceberg-rest
    container_name: lab3-iceberg-rest
    environment:
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: admin
      CATALOG_S3_SECRET__ACCESS__KEY: password
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      create-buckets:
        condition: service_completed_successfully
    networks:
      - flink-network

  # ==============================================================================
  # Flink JobManager
  # ==============================================================================
  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab3-jobmanager
    hostname: jobmanager
    environment:
      - AWS_REGION=us-east-1
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        execution.checkpointing.interval: 10s
        state.backend: rocksdb
        state.backend.incremental: true
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.min-pause: 5s
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.access.key: admin
        fs.s3a.secret.key: password
        fs.s3a.path.style.access: true
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - ./data:/workspace/data
      - ./sql:/workspace/sql
      - ./scripts:/workspace/scripts
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - flink-network

  # ==============================================================================
  # Flink TaskManager
  # ==============================================================================
  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab3-taskmanager
    hostname: taskmanager
    environment:
      - AWS_REGION=us-east-1
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.access.key: admin
        fs.s3a.secret.key: password
        fs.s3a.path.style.access: true
    command: taskmanager
    volumes:
      - ./data:/workspace/data
    depends_on:
      - jobmanager
    networks:
      - flink-network

  # ==============================================================================
  # Python Data Generator
  # ==============================================================================
  python:
    image: python:3.11-slim
    container_name: lab3-python
    working_dir: /workspace
    volumes:
      - ./data:/workspace/data
      - ./scripts:/workspace/scripts
      - ./producer.py:/workspace/producer.py
      - ./requirements.txt:/workspace/requirements.txt
    command: >
      bash -c "
      pip install --no-cache-dir -r requirements.txt &&
      echo 'Python environment ready. Use: docker exec lab3-python python producer.py' &&
      tail -f /dev/null
      "
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      S3_BUCKET: raw-input
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - flink-network

volumes:
  minio-data:

networks:
  flink-network:
    driver: bridge
